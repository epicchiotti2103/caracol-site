<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>apps.yaml · Product Builder</title>
  <meta name="description" content="Form-driven builder pra adicionar produtos no apps.yaml do AppsFlyer Campaign Analyzer." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .font-display { font-family: 'Bricolage Grotesque', system-ui, sans-serif; }
    .font-body    { font-family: 'Geist', system-ui, sans-serif; }
    .font-mono    { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    html, body    { background: #0c0a09; }
    select option { background: #1c1917; color: #f5f5f4; }

    /* hide tailwind cdn dev warning in console-bug-light way */
    .grain-bg {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
  </style>
</head>
<body class="font-body">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useMemo, useEffect, useRef } = React;

    // =====================================================================
    // Inline SVG icons (replace lucide-react)
    // =====================================================================
    const Icon = ({ children, size = 16, className = '', ...props }) => (
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width={size} height={size}
        viewBox="0 0 24 24" fill="none"
        stroke="currentColor" strokeWidth="2"
        strokeLinecap="round" strokeLinejoin="round"
        className={className} {...props}
      >
        {children}
      </svg>
    );
    const Plus      = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
    const Trash2    = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></Icon>;
    const Copy      = (p) => <Icon {...p}><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></Icon>;
    const Check     = (p) => <Icon {...p}><polyline points="20 6 9 17 4 12"/></Icon>;
    const AlertTri  = (p) => <Icon {...p}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></Icon>;
    const RotateCcw = (p) => <Icon {...p}><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></Icon>;
    const Settings2 = (p) => <Icon {...p}><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></Icon>;
    const Save      = (p) => <Icon {...p}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></Icon>;

    // =====================================================================
    // YAML generation
    // =====================================================================
    const fmtMoney = (v) => {
      if (v === '' || v === null || v === undefined) return '0.00';
      const n = parseFloat(v); return isNaN(n) ? '0.00' : n.toFixed(2);
    };
    const fmtRatio = (v) => {
      if (v === '' || v === null || v === undefined) return '0';
      const n = parseFloat(v); return isNaN(n) ? '0' : n.toFixed(2);
    };
    const yamlString = (s) => `"${(s || '').replace(/"/g, '\\"')}"`;

    function generateYaml(p) {
      const I = (n) => '  '.repeat(n);
      const lines = [];

      lines.push(`${I(1)}- name: ${yamlString(p.name || 'NOME_DO_PRODUTO')}`);
      lines.push(`${I(2)}af_prt: ${yamlString(p.af_prt || 'AF_PRT')}`);
      lines.push(`${I(2)}type: ${yamlString(p.type || 'ua')}`);
      lines.push(`${I(2)}timezone: ${yamlString(p.timezone)}`);
      lines.push(`${I(2)}currency: ${yamlString(p.currency)}`);
      lines.push('');

      lines.push(`${I(2)}budget:`);
      lines.push(`${I(3)}mode: ${yamlString(p.budget.mode)}`);
      if (p.budget.mode === 'total') {
        lines.push(`${I(3)}monthly: ${fmtMoney(p.budget.monthly)}`);
        if (p.budget.use_pool_split) {
          lines.push(`${I(3)}pool_split:`);
          lines.push(`${I(4)}cpa: ${fmtRatio(p.budget.pool_cpa)}`);
          lines.push(`${I(4)}cpi: ${fmtRatio(p.budget.pool_cpi)}`);
        }
      }
      lines.push('');

      lines.push(`${I(2)}paid_events:`);
      p.paid_events.forEach((e) => {
        lines.push(`${I(3)}- name: ${yamlString(e.name || 'evento')}`);
        if (e.target_cpa !== '' && e.target_cpa !== null)
          lines.push(`${I(4)}target_cpa: ${fmtMoney(e.target_cpa)}`);
        if (p.budget.mode === 'per_event')
          lines.push(`${I(4)}budget_monthly: ${fmtMoney(e.budget_monthly)}`);
      });
      lines.push('');

      lines.push(`${I(2)}apps:`);
      p.apps.forEach((a) => {
        lines.push(`${I(3)}- name: ${yamlString(a.name || 'plataforma')}`);
        lines.push(`${I(4)}app_id: ${yamlString(a.app_id || 'app_id')}`);
        lines.push(`${I(4)}platform: ${yamlString(a.platform)}`);
        lines.push(`${I(4)}p360_enabled: ${a.p360_enabled}`);
        lines.push(`${I(4)}only_primary_attribution: ${a.only_primary_attribution}`);
        const files = (a.impressions_files || '')
          .split('\n').map((s) => s.trim()).filter(Boolean);
        if (files.length > 0) {
          lines.push(`${I(4)}impressions_files:`);
          files.forEach((f) => lines.push(`${I(5)}- ${yamlString(f)}`));
        }
      });
      lines.push('');

      lines.push(`${I(2)}media_sources:`);
      p.media_sources.forEach((s) => {
        lines.push(`${I(3)}- name: ${yamlString(s.name || 'source')}`);
        if (s.campaign_type === 'cpi') {
          lines.push(`${I(4)}campaign_type: "cpi"`);
          lines.push(`${I(4)}target_cpi: ${fmtMoney(s.target_cpi)}`);
        }
        if (s.min_installs_to_evaluate !== '' && Number(s.min_installs_to_evaluate) !== 30)
          lines.push(`${I(4)}min_installs_to_evaluate: ${parseInt(s.min_installs_to_evaluate, 10)}`);
      });
      lines.push('');

      if (p.recent_projection_days && Number(p.recent_projection_days) !== 7)
        lines.push(`${I(2)}recent_projection_days: ${parseInt(p.recent_projection_days, 10)}`);
      lines.push(`${I(2)}pause_rules: *default_pause_rules`);

      return lines.join('\n');
    }

    // =====================================================================
    // Validation
    // =====================================================================
    function validate(p) {
      const issues = [];
      if (!p.name) issues.push('Nome do produto vazio');
      if (!p.af_prt) issues.push('af_prt vazio (não vai resolver token no .env)');

      if (p.budget.mode === 'total') {
        if (!p.budget.monthly) issues.push('Budget total sem `monthly`');
        if (p.budget.use_pool_split) {
          const sum = parseFloat(p.budget.pool_cpa || 0) + parseFloat(p.budget.pool_cpi || 0);
          if (Math.abs(sum - 1.0) > 0.001)
            issues.push(`pool_split soma ${sum.toFixed(2)} — precisa dar 1.00`);
        }
      }
      p.paid_events.forEach((e, i) => {
        if (!e.name) issues.push(`Evento ${i + 1}: name vazio`);
        if (p.budget.mode === 'per_event' && !e.budget_monthly)
          issues.push(`Evento ${i + 1} (${e.name || '?'}): mode=per_event exige budget_monthly`);
      });
      p.apps.forEach((a, i) => {
        if (!a.name) issues.push(`Plataforma ${i + 1}: name vazio`);
        if (!a.app_id) issues.push(`Plataforma ${i + 1} (${a.name || '?'}): app_id vazio`);
      });
      p.media_sources.forEach((s, i) => {
        if (!s.name) issues.push(`Source ${i + 1}: name vazio`);
        if (s.campaign_type === 'cpi' && !s.target_cpi)
          issues.push(`Source ${i + 1} (${s.name || '?'}): campaign_type=cpi exige target_cpi`);
      });
      return issues;
    }

    // =====================================================================
    // State + persistence
    // =====================================================================
    const STORAGE_KEY = 'apps_yaml_builder_draft_v1';

    const blankProduct = () => ({
      name: '', af_prt: '',
      type: 'ua',                                 // 'ua' (User Acquisition) ou 'rtg' (Retargeting)
      timezone: 'America/Sao_Paulo', currency: 'BRL',
      recent_projection_days: 7,
      budget: { mode: 'total', monthly: '', use_pool_split: false, pool_cpa: '0.70', pool_cpi: '0.30' },
      paid_events: [{ name: '', target_cpa: '', budget_monthly: '' }],
      apps: [{
        name: '', app_id: '', platform: 'android',
        p360_enabled: true, only_primary_attribution: true, impressions_files: '',
      }],
      media_sources: [{ name: '', campaign_type: 'cpa', target_cpi: '', min_installs_to_evaluate: 30 }],
    });

    const loadDraft = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object') return null;
        return parsed;
      } catch { return null; }
    };

    const saveDraft = (data) => {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
    };

    const TIMEZONES = [
      'America/Sao_Paulo', 'Asia/Hong_Kong', 'America/New_York',
      'Europe/London', 'Europe/Rome', 'UTC',
    ];

    const COMMON_SOURCES = [
      'googleadwords_int', 'Facebook Ads', 'tiktokglobal_int',
      'applovin_int', 'unityads_int', 'snapchat_int',
    ];

    // =====================================================================
    // UI primitives
    // =====================================================================
    const inputBase =
      'w-full bg-stone-900/60 border border-stone-800 rounded-md px-3 py-2 text-stone-100 placeholder:text-stone-600 focus:outline-none focus:border-orange-400/60 focus:bg-stone-900 transition-colors';
    const inputMono = `${inputBase} font-mono text-sm`;

    const Field = ({ label, hint, children, required }) => (
      <label className="block">
        <div className="flex items-baseline justify-between gap-2 mb-1.5">
          <span className="text-[11px] uppercase tracking-[0.14em] text-stone-400 font-medium">
            {label} {required && <span className="text-orange-400">*</span>}
          </span>
          {hint && <span className="text-[10px] text-stone-500 italic">{hint}</span>}
        </div>
        {children}
      </label>
    );

    const Input = ({ mono = false, ...props }) => (
      <input className={mono ? inputMono : inputBase} {...props} />
    );

    const Select = ({ children, ...props }) => (
      <select className={`${inputBase} appearance-none cursor-pointer pr-8`} {...props}>
        {children}
      </select>
    );

    const Toggle = ({ checked, onChange, label }) => (
      <button type="button" onClick={() => onChange(!checked)} className="flex items-center gap-2.5 group">
        <div className={`relative w-9 h-5 rounded-full transition-colors ${checked ? 'bg-orange-400' : 'bg-stone-700'}`}>
          <div className={`absolute top-0.5 w-4 h-4 rounded-full bg-stone-950 transition-transform ${checked ? 'translate-x-4' : 'translate-x-0.5'}`} />
        </div>
        <span className="text-sm text-stone-300 group-hover:text-stone-100">{label}</span>
      </button>
    );

    const SegmentedControl = ({ value, onChange, options }) => (
      <div className="inline-flex bg-stone-900/60 border border-stone-800 rounded-md p-0.5">
        {options.map((opt) => (
          <button
            key={opt.value} type="button" onClick={() => onChange(opt.value)}
            className={`px-3 py-1.5 text-sm rounded-sm transition-colors ${
              value === opt.value
                ? 'bg-orange-400 text-stone-950 font-semibold'
                : 'text-stone-400 hover:text-stone-100'
            }`}
          >
            {opt.label}
          </button>
        ))}
      </div>
    );

    const Section = ({ title, subtitle, children, action }) => (
      <section className="bg-stone-900/40 border border-stone-800 rounded-lg p-5">
        <div className="flex items-start justify-between gap-3 mb-5 pb-4 border-b border-stone-800/80">
          <div>
            <h2 className="font-display text-lg font-semibold text-stone-100 leading-tight">{title}</h2>
            {subtitle && <p className="text-xs text-stone-500 mt-1 leading-relaxed">{subtitle}</p>}
          </div>
          {action}
        </div>
        <div className="space-y-4">{children}</div>
      </section>
    );

    const ItemCard = ({ index, label, onRemove, canRemove, children }) => (
      <div className="bg-stone-950/60 border border-stone-800/80 rounded-md p-4 relative">
        <div className="flex items-center justify-between mb-3">
          <span className="text-[10px] uppercase tracking-[0.16em] text-orange-400/80 font-mono font-semibold">
            {label} #{index + 1}
          </span>
          {canRemove && (
            <button type="button" onClick={onRemove}
              className="text-stone-500 hover:text-rose-400 transition-colors" title="Remover">
              <Trash2 size={14} />
            </button>
          )}
        </div>
        <div className="space-y-3">{children}</div>
      </div>
    );

    const AddButton = ({ onClick, label }) => (
      <button type="button" onClick={onClick}
        className="w-full border border-dashed border-stone-700 hover:border-orange-400/60 text-stone-500 hover:text-orange-400 rounded-md py-2.5 text-sm transition-colors flex items-center justify-center gap-1.5">
        <Plus size={14} />
        {label}
      </button>
    );

    // =====================================================================
    // Main component
    // =====================================================================
    function YamlBuilder() {
      const [p, setP] = useState(() => loadDraft() || blankProduct());
      const [copied, setCopied] = useState(false);
      const [savedFlash, setSavedFlash] = useState(false);
      const firstRender = useRef(true);

      const yaml   = useMemo(() => generateYaml(p), [p]);
      const issues = useMemo(() => validate(p), [p]);

      // Auto-save
      useEffect(() => {
        if (firstRender.current) { firstRender.current = false; return; }
        saveDraft(p);
        setSavedFlash(true);
        const t = setTimeout(() => setSavedFlash(false), 1200);
        return () => clearTimeout(t);
      }, [p]);

      const update = (path, value) => {
        setP((prev) => {
          const next = JSON.parse(JSON.stringify(prev));
          const keys = path.split('.');
          let obj = next;
          for (let i = 0; i < keys.length - 1; i++) obj = obj[keys[i]];
          obj[keys[keys.length - 1]] = value;
          return next;
        });
      };

      const updateArray = (key, index, field, value) => {
        setP((prev) => {
          const next = JSON.parse(JSON.stringify(prev));
          next[key][index][field] = value;
          return next;
        });
      };

      const addEvent = () =>
        setP((prev) => ({ ...prev,
          paid_events: [...prev.paid_events, { name: '', target_cpa: '', budget_monthly: '' }],
        }));
      const removeEvent = (i) =>
        setP((prev) => ({ ...prev, paid_events: prev.paid_events.filter((_, idx) => idx !== i) }));

      const addApp = () =>
        setP((prev) => ({ ...prev,
          apps: [...prev.apps, {
            name: '', app_id: '',
            platform: prev.apps.some((a) => a.platform === 'android') ? 'ios' : 'android',
            p360_enabled: true, only_primary_attribution: true, impressions_files: '',
          }],
        }));
      const removeApp = (i) =>
        setP((prev) => ({ ...prev, apps: prev.apps.filter((_, idx) => idx !== i) }));

      const addSource = () =>
        setP((prev) => ({ ...prev,
          media_sources: [...prev.media_sources,
            { name: '', campaign_type: 'cpa', target_cpi: '', min_installs_to_evaluate: 30 }],
        }));
      const removeSource = (i) =>
        setP((prev) => ({ ...prev, media_sources: prev.media_sources.filter((_, idx) => idx !== i) }));

      const reset = () => {
        if (confirm('Limpar todos os campos? O rascunho salvo também será apagado.')) {
          try { localStorage.removeItem(STORAGE_KEY); } catch {}
          setP(blankProduct());
        }
      };

      const copyYaml = async () => {
        try {
          await navigator.clipboard.writeText(yaml);
        } catch {
          const ta = document.createElement('textarea');
          ta.value = yaml; document.body.appendChild(ta);
          ta.select(); document.execCommand('copy');
          document.body.removeChild(ta);
        }
        setCopied(true);
        setTimeout(() => setCopied(false), 1800);
      };

      const hasCpiSource = p.media_sources.some((s) => s.campaign_type === 'cpi');

      return (
        <div className="min-h-screen bg-stone-950 text-stone-100 selection:bg-orange-400/30">
          <div className="grain-bg fixed inset-0 pointer-events-none opacity-[0.025] mix-blend-overlay" />

          <div className="relative max-w-[1400px] mx-auto px-6 lg:px-10 py-8 lg:py-12">
            {/* Header */}
            <header className="mb-8 flex flex-wrap items-end justify-between gap-4 pb-6 border-b border-stone-800">
              <div>
                <div className="flex items-center gap-3 mb-2">
                  <div className="w-1.5 h-6 bg-orange-400 rounded-sm" />
                  <span className="font-mono text-xs uppercase tracking-[0.2em] text-orange-400/90">
                    apps.yaml · product builder
                  </span>
                </div>
                <h1 className="font-display text-3xl lg:text-4xl font-bold tracking-tight text-stone-100 flex flex-wrap items-center gap-3">
                  Novo produto pra <span className="italic text-orange-400">apps.yaml</span>
                  <span
                    className={`inline-flex items-center font-mono text-xs font-bold tracking-[0.18em] px-2.5 py-1 rounded-md border ${
                      p.type === 'rtg'
                        ? 'bg-orange-400/15 border-orange-400/40 text-orange-300'
                        : 'bg-sky-400/10 border-sky-400/30 text-sky-300'
                    }`}
                    title={p.type === 'rtg' ? 'Retargeting' : 'User Acquisition'}
                  >
                    {p.type === 'rtg' ? 'RTG' : 'UA'}
                  </span>
                </h1>
                <p className="text-sm text-stone-400 mt-2 max-w-2xl">
                  Preencha os campos abaixo. O YAML é gerado em tempo real à direita — pronto pra colar
                  debaixo de <code className="font-mono text-orange-400/80">products:</code>.
                </p>
              </div>
              <div className="flex items-center gap-3">
                <span className={`flex items-center gap-1.5 text-[11px] font-mono uppercase tracking-wider transition-opacity ${savedFlash ? 'text-orange-400 opacity-100' : 'text-stone-500 opacity-60'}`}>
                  <Save size={12} />
                  {savedFlash ? 'salvo' : 'auto-save'}
                </span>
                <button onClick={reset}
                  className="flex items-center gap-2 text-xs text-stone-500 hover:text-stone-200 transition-colors px-3 py-2 border border-stone-800 rounded-md">
                  <RotateCcw size={13} />
                  Limpar
                </button>
              </div>
            </header>

            {/* Grid */}
            <div className="grid lg:grid-cols-[minmax(0,1fr)_minmax(380px,520px)] gap-6 lg:gap-8 items-start">
              {/* FORM */}
              <div className="space-y-5">
                <Section
                  title="Identidade do produto"
                  subtitle="Nome amigável + token. O af_prt resolve APPSFLYER_TOKEN_<af_prt em maiúsculas> no .env."
                >
                  <div className="grid sm:grid-cols-2 gap-4">
                    <Field label="Nome" required hint={p.type === 'rtg' ? 'ex: Claro RTG (sufixo recomendado)' : 'ex: Lalamove DVR'}>
                      <Input placeholder="Nome do produto" value={p.name}
                        onChange={(e) => update('name', e.target.value)} />
                    </Field>
                    <Field label="af_prt" required hint="resolve token no .env">
                      <Input mono placeholder="wavesyncdibr359" value={p.af_prt}
                        onChange={(e) => update('af_prt', e.target.value.trim())} />
                    </Field>
                    <Field
                      label="Tipo de produto"
                      required
                      hint="UA = installs novos · RTG = re-engagement"
                    >
                      <SegmentedControl
                        value={p.type}
                        onChange={(v) => update('type', v)}
                        options={[
                          { value: 'ua', label: 'UA' },
                          { value: 'rtg', label: 'RTG' },
                        ]}
                      />
                    </Field>
                    <Field label="Timezone">
                      <Select value={p.timezone} onChange={(e) => update('timezone', e.target.value)}>
                        {TIMEZONES.map((tz) => <option key={tz} value={tz}>{tz}</option>)}
                      </Select>
                    </Field>
                    <Field label="Currency">
                      <Input mono value={p.currency}
                        onChange={(e) => update('currency', e.target.value.toUpperCase())} />
                    </Field>
                  </div>

                  {p.type === 'rtg' && (
                    <div className="text-xs text-orange-300/90 bg-orange-400/[0.06] border border-orange-400/25 rounded-md p-3 flex gap-2 mt-2">
                      <AlertTri size={14} className="flex-shrink-0 mt-0.5" />
                      <div className="leading-relaxed">
                        Produto <span className="font-mono font-semibold">RTG</span> — vai puxar
                        <span className="font-mono"> installs-retarget</span> e
                        <span className="font-mono"> in-app-events-retarget</span>. Se o mesmo app
                        também tem UA ativo, crie outro produto com o sufixo
                        <span className="font-mono"> &nbsp;UA</span> (ex.
                        <span className="font-mono"> "Claro UA"</span> e
                        <span className="font-mono"> "Claro RTG"</span>) — mesmo
                        <span className="font-mono"> af_prt</span> e mesmos
                        <span className="font-mono"> app_ids</span>.
                        <span className="font-mono"> impressions_files</span> são ignorados em RTG.
                      </div>
                    </div>
                  )}
                </Section>

                <Section
                  title="Orçamento"
                  subtitle="`total` = budget único pro produto. `per_event` = cada evento tem seu próprio budget."
                >
                  <div className="space-y-4">
                    <div>
                      <div className="text-[11px] uppercase tracking-[0.14em] text-stone-400 font-medium mb-2">Modo</div>
                      <SegmentedControl value={p.budget.mode}
                        onChange={(v) => update('budget.mode', v)}
                        options={[
                          { value: 'total', label: 'Total' },
                          { value: 'per_event', label: 'Por evento' },
                        ]} />
                    </div>

                    {p.budget.mode === 'total' && (
                      <>
                        <Field label="Budget mensal (BRL)" required>
                          <Input mono type="number" step="0.01" placeholder="19500.00"
                            value={p.budget.monthly}
                            onChange={(e) => update('budget.monthly', e.target.value)} />
                        </Field>

                        <div className="pt-2 border-t border-stone-800/60">
                          <Toggle checked={p.budget.use_pool_split}
                            onChange={(v) => update('budget.use_pool_split', v)}
                            label="Usar pool_split (CPA + CPI no mesmo budget)" />
                          {p.budget.use_pool_split && (
                            <div className="grid grid-cols-2 gap-3 mt-3">
                              <Field label="Pool CPA" hint="ex: 0.70">
                                <Input mono type="number" step="0.01" min="0" max="1"
                                  value={p.budget.pool_cpa}
                                  onChange={(e) => update('budget.pool_cpa', e.target.value)} />
                              </Field>
                              <Field label="Pool CPI" hint="ex: 0.30">
                                <Input mono type="number" step="0.01" min="0" max="1"
                                  value={p.budget.pool_cpi}
                                  onChange={(e) => update('budget.pool_cpi', e.target.value)} />
                              </Field>
                            </div>
                          )}
                        </div>
                      </>
                    )}

                    {p.budget.mode === 'per_event' && (
                      <p className="text-xs text-stone-500 italic">
                        Cada evento abaixo precisa ter <code className="font-mono">budget_monthly</code>.
                      </p>
                    )}
                  </div>
                </Section>

                <Section title="Eventos pagos" subtitle="Eventos que você paga / contabiliza. 1 ou mais.">
                  {p.paid_events.map((e, i) => (
                    <ItemCard key={i} index={i} label="evento"
                      canRemove={p.paid_events.length > 1}
                      onRemove={() => removeEvent(i)}>
                      <Field label="Nome do evento" required hint="exato como na AppsFlyer">
                        <Input mono placeholder="order_place_first" value={e.name}
                          onChange={(ev) => updateArray('paid_events', i, 'name', ev.target.value.trim())} />
                      </Field>
                      <div className="grid sm:grid-cols-2 gap-3">
                        <Field label="Target CPA (BRL)" hint="opcional se só monitorando">
                          <Input mono type="number" step="0.01" placeholder="20.00"
                            value={e.target_cpa}
                            onChange={(ev) => updateArray('paid_events', i, 'target_cpa', ev.target.value)} />
                        </Field>
                        {p.budget.mode === 'per_event' && (
                          <Field label="Budget mensal (BRL)" required>
                            <Input mono type="number" step="0.01" placeholder="4000.00"
                              value={e.budget_monthly}
                              onChange={(ev) => updateArray('paid_events', i, 'budget_monthly', ev.target.value)} />
                          </Field>
                        )}
                      </div>
                    </ItemCard>
                  ))}
                  <AddButton onClick={addEvent} label="Adicionar evento" />
                </Section>

                <Section title="Plataformas"
                  subtitle="Cada app no AppsFlyer. Android e iOS do mesmo produto vão como 2 apps aqui.">
                  {p.apps.map((a, i) => (
                    <ItemCard key={i} index={i} label="plataforma"
                      canRemove={p.apps.length > 1} onRemove={() => removeApp(i)}>
                      <div className="grid sm:grid-cols-2 gap-3">
                        <Field label="Nome amigável" required>
                          <Input placeholder="Lalamove DVR Android" value={a.name}
                            onChange={(ev) => updateArray('apps', i, 'name', ev.target.value)} />
                        </Field>
                        <Field label="Plataforma">
                          <SegmentedControl value={a.platform}
                            onChange={(v) => updateArray('apps', i, 'platform', v)}
                            options={[
                              { value: 'android', label: 'Android' },
                              { value: 'ios', label: 'iOS' },
                            ]} />
                        </Field>
                      </div>
                      <Field label="App ID" required
                        hint={a.platform === 'android'
                          ? 'package name, ex: com.lalamove.global.driver.sea'
                          : 'app id, ex: id1522419641'}>
                        <Input mono
                          placeholder={a.platform === 'android' ? 'com.empresa.app' : 'id1234567890'}
                          value={a.app_id}
                          onChange={(ev) => updateArray('apps', i, 'app_id', ev.target.value.trim())} />
                      </Field>
                      <div className="flex flex-wrap gap-x-6 gap-y-2 pt-1">
                        <Toggle checked={a.p360_enabled}
                          onChange={(v) => updateArray('apps', i, 'p360_enabled', v)}
                          label="P360 ativo" />
                        <Toggle checked={a.only_primary_attribution}
                          onChange={(v) => updateArray('apps', i, 'only_primary_attribution', v)}
                          label="only_primary_attribution" />
                      </div>
                      <Field label="impressions_files (opcional)" hint="1 caminho/glob por linha">
                        <textarea className={`${inputMono} resize-y min-h-[60px]`}
                          placeholder="data/impressions/lalamove_usr/*.csv"
                          value={a.impressions_files}
                          onChange={(ev) => updateArray('apps', i, 'impressions_files', ev.target.value)} />
                      </Field>
                    </ItemCard>
                  ))}
                  <AddButton onClick={addApp} label="Adicionar plataforma" />
                </Section>

                <Section title="Media sources"
                  subtitle="As sources que você quer monitorar. CPA usa target_cpa do evento; CPI exige target_cpi próprio.">
                  {p.media_sources.map((s, i) => (
                    <ItemCard key={i} index={i} label="source"
                      canRemove={p.media_sources.length > 1}
                      onRemove={() => removeSource(i)}>
                      <Field label="Nome" required hint="exato como na AppsFlyer">
                        <Input mono placeholder="googleadwords_int" value={s.name}
                          onChange={(ev) => updateArray('media_sources', i, 'name', ev.target.value)}
                          list={`source-suggestions-${i}`} />
                        <datalist id={`source-suggestions-${i}`}>
                          {COMMON_SOURCES.map((cs) => <option key={cs} value={cs} />)}
                        </datalist>
                      </Field>
                      <div className="grid sm:grid-cols-2 gap-3">
                        <Field label="Tipo de campanha">
                          <SegmentedControl value={s.campaign_type}
                            onChange={(v) => updateArray('media_sources', i, 'campaign_type', v)}
                            options={[
                              { value: 'cpa', label: 'CPA' },
                              { value: 'cpi', label: 'CPI' },
                            ]} />
                        </Field>
                        {s.campaign_type === 'cpi' && (
                          <Field label="Target CPI (BRL)" required>
                            <Input mono type="number" step="0.01" placeholder="4.50"
                              value={s.target_cpi}
                              onChange={(ev) => updateArray('media_sources', i, 'target_cpi', ev.target.value)} />
                          </Field>
                        )}
                      </div>
                      <Field label="min_installs_to_evaluate" hint="default 30">
                        <Input mono type="number" step="1" min="0"
                          value={s.min_installs_to_evaluate}
                          onChange={(ev) => updateArray('media_sources', i, 'min_installs_to_evaluate', ev.target.value)} />
                      </Field>
                    </ItemCard>
                  ))}
                  <AddButton onClick={addSource} label="Adicionar source" />

                  {hasCpiSource && p.budget.mode === 'total' && !p.budget.use_pool_split && (
                    <div className="text-xs text-amber-300/80 bg-amber-400/5 border border-amber-400/20 rounded-md p-3 flex gap-2">
                      <AlertTri size={14} className="flex-shrink-0 mt-0.5" />
                      <span>
                        Você tem source com <code className="font-mono">campaign_type: cpi</code> e
                        modo <code className="font-mono">total</code> sem{' '}
                        <code className="font-mono">pool_split</code>. Considere ativar o split pra ter
                        pace separado de CPA/CPI.
                      </span>
                    </div>
                  )}
                </Section>

                <Section
                  title={<span className="flex items-center gap-2"><Settings2 size={16} className="text-stone-500" />Avançado</span>}
                  subtitle="Opcionais. Deixe em branco pra usar default.">
                  <Field label="recent_projection_days" hint="default 7">
                    <Input mono type="number" step="1" min="1"
                      value={p.recent_projection_days}
                      onChange={(e) => update('recent_projection_days', e.target.value)} />
                  </Field>
                  <p className="text-xs text-stone-500 italic pt-1">
                    <code className="font-mono">pause_rules</code> usa{' '}
                    <code className="font-mono text-orange-400/70">*default_pause_rules</code>{' '}
                    automaticamente. Pra customizar, edite no YAML depois.
                  </p>
                </Section>
              </div>

              {/* OUTPUT */}
              <div className="lg:sticky lg:top-6">
                <div className="bg-stone-900/40 border border-stone-800 rounded-lg overflow-hidden">
                  <div className="flex items-center justify-between px-5 py-3 border-b border-stone-800 bg-stone-900/60">
                    <div className="flex items-center gap-2">
                      <div className="flex gap-1.5">
                        <div className="w-2.5 h-2.5 rounded-full bg-rose-400/40" />
                        <div className="w-2.5 h-2.5 rounded-full bg-amber-300/40" />
                        <div className="w-2.5 h-2.5 rounded-full bg-orange-400/60" />
                      </div>
                      <span className="font-mono text-[11px] uppercase tracking-[0.16em] text-stone-400 ml-2">
                        apps.yaml
                      </span>
                    </div>
                    <button onClick={copyYaml}
                      className={`flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-md transition-all ${
                        copied ? 'bg-orange-400 text-stone-950 font-semibold'
                               : 'bg-stone-800 hover:bg-stone-700 text-stone-200'
                      }`}>
                      {copied ? (<><Check size={13} />Copiado!</>) : (<><Copy size={13} />Copiar YAML</>)}
                    </button>
                  </div>

                  {issues.length > 0 && (
                    <div className="px-5 py-3 bg-amber-400/[0.04] border-b border-amber-400/10">
                      <div className="flex items-start gap-2 text-xs">
                        <AlertTri size={14} className="text-amber-300 flex-shrink-0 mt-0.5" />
                        <div>
                          <div className="text-amber-300 font-semibold mb-1">
                            {issues.length} pendência{issues.length > 1 ? 's' : ''}
                          </div>
                          <ul className="text-amber-200/70 space-y-0.5">
                            {issues.map((iss, i) => (
                              <li key={i} className="leading-snug">· {iss}</li>
                            ))}
                          </ul>
                        </div>
                      </div>
                    </div>
                  )}

                  <pre className="font-mono text-[12.5px] leading-[1.65] text-stone-200 px-5 py-4 overflow-x-auto max-h-[70vh] whitespace-pre">
                    <code>{yaml}</code>
                  </pre>
                </div>

                <div className="mt-4 text-xs text-stone-500 leading-relaxed px-1">
                  Cole o bloco acima em <code className="font-mono text-stone-400">config/apps.yaml</code>,
                  debaixo de <code className="font-mono text-stone-400">products:</code>, mantendo a
                  indentação. Não esqueça de adicionar{' '}
                  <code className="font-mono text-stone-400">
                    APPSFLYER_TOKEN_{(p.af_prt || 'AF_PRT').toUpperCase()}
                  </code>{' '}
                  no <code className="font-mono text-stone-400">.env</code>.
                </div>
              </div>
            </div>

            <footer className="mt-12 pt-6 border-t border-stone-800/60 text-[11px] text-stone-600 text-center font-mono">
              roda 100% client-side · auto-save no localStorage do navegador
            </footer>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<YamlBuilder />);
  </script>
</body>
</html>
